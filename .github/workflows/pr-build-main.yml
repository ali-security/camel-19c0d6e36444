name: PR Build (Camel 4)

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    permissions:
      issues: write
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      matrix:
        java: [ '17' ]
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: install-packages
        uses: ./.github/actions/install-packages
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: maven build
        run: ./mvnw -B -V -ntp -Dquickly install -pl components/camel-xpath,core/camel-core -am
      - name: mvn test
        run: |
          MVN_OPTS="-B -V -e -ntp -Daether.connector.http.connectionMaxTtl=120 -Daether.connector.requestTimeout=300000 -Dmaven.artifact.threads=25 -Dci.env.name=github.com -Dsurefire.rerunFailingTestsCount=2 -Dfailsafe.rerunFailingTestsCount=2 -Dcamel.surefire.parallel=false"
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./mvnw $MVN_OPTS install -pl core/camel-core,components/camel-xpath -Dtest="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./mvnw $MVN_OPTS install -pl core/camel-core,components/camel-xpath
          fi
      - name: upload camel-xpath jar
        uses: actions/upload-artifact@v4
        with:
          name: camel-xpath-jar
          path: components/camel-xpath/target/camel-xpath-*[0-9].jar
          if-no-files-found: error
      - name: test summary
        if: always()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          tot = fail = err = skip = 0
          skipped = []
          for f in sorted(glob.glob('core/camel-core/target/surefire-reports/TEST-*.xml') + glob.glob('components/camel-xpath/target/surefire-reports/TEST-*.xml')):
              r = ET.parse(f).getroot()
              tot += int(r.get('tests', 0)); fail += int(r.get('failures', 0)); err += int(r.get('errors', 0)); skip += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  s = tc.find('skipped')
                  if s is not None:
                      reason = (s.get('message') or (s.text or '').strip() or 'no message (disabled/assumption)').splitlines()[0][:160]
                      skipped.append('%s.%s: %s' % (tc.get('classname'), tc.get('name'), reason))
          print('==== Skipped tests (%d) ====' % len(skipped))
          for line in skipped:
              print('SKIPPED ' + line)
          print('==== Surefire totals (camel-core + camel-xpath) ====')
          print('Tests run: %d, Passed: %d, Failures: %d, Errors: %d, Skipped: %d' % (tot, tot - fail - err - skip, fail, err, skip))
